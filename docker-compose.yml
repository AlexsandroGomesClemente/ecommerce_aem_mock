# Orquestração completa do Ecossistema com Docker Compose
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce" ]
      interval: 5s
      timeout: 5s
      retries: 10

  aem-cms-mock:
    build:
      context: ./aem-mock
      dockerfile: Dockerfile
    container_name: ecommerce-aem-jcr
    ports:
      - "4502:4502"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-bff-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AEM_ENDPOINT: http://aem-cms-mock:4502
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      aem-cms-mock:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./ui.frontend/Dockerfile
    container_name: ecommerce-vue-aem-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecommerce-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  postgres_data:

